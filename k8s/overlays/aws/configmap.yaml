# ==============================================================================
# ConfigMap patch — AWS (sobrescreve valores do base/configmap.yaml)
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: techchallenge
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  OTEL_SERVICE_NAME: "billing-service"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.monitoring.svc.cluster.local:4318"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=techchallenge,deployment.environment=production"
