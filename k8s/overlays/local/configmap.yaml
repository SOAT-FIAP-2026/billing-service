# ==============================================================================
# ConfigMap patch — LOCAL (sobrescreve valores do base/configmap.yaml)
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: techchallenge
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  # NOSONAR — ambiente local sem certificado; não é exposto diretamente à Internet.
  ASPNETCORE_URLS: "http://+:8080"
  AWS_REGION: "sa-east-1"
  OTEL_SERVICE_NAME: "billing-service"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  # NOSONAR — endpoint interno do cluster; o collector não expõe TLS neste ambiente.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://opentelemetry-collector.monitoring.svc.cluster.local:4318"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=techchallenge,deployment.environment=development"
  DOTNET_USE_POLLING_FILE_WATCHER: "true" # Hot Reload em produção não é recomendado, mas aqui ajuda muito no desenvolvimento
