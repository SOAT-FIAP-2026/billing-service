# ==============================================================================
# Billing Service — Deployment
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: techchallenge
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: techchallenge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: techchallenge
      annotations:
        ad.datadoghq.com/billing-service.logs: '[{"source":"csharp","service":"billing-service"}]'
    spec:
      automountServiceAccountToken: false
      containers:
        - name: billing-service
          image: gabrielnetto94/billing-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: billing-service-config
            - secretRef:
                name: billing-service-secret
          resources:
            requests:
              cpu: 100m # menor para facilitar trigger do HPA em testes locais
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12 # 5 + (5 * 12) = 65s max para startup
