name: CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "k8s/**"
      - "Dockerfile"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/billing-service

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Billing Service
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Checkout shared contracts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: SOAT-FIAP-2026/shared
          ref: main
          path: .shared
          persist-credentials: false

      - name: Move shared to sibling directory
        run: |
          rm -rf ../shared
          mv .shared ../shared

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/Billing.Service.Tests/Billing.Service.Tests.csproj

      - name: Build
        run: dotnet build tests/Billing.Service.Tests/Billing.Service.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Billing.Service.Tests/Billing.Service.Tests.csproj --configuration Release --no-build --verbosity normal

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Billing Service
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Checkout shared contracts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: SOAT-FIAP-2026/shared
          ref: main
          path: .shared
          persist-credentials: false

      - name: Move shared to sibling directory
        run: |
          rm -rf ../shared
          mv .shared ../shared

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to Docker Hub
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha256-

      - name: Build and push image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          build-contexts: |
            shared=../shared
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: docker-build-push
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Billing Service
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: sa-east-1
          audience: sts.amazonaws.com
          role-session-name: github-actions-billing-eks

      - name: Configure EKS kubeconfig
        run: aws eks update-kubeconfig --name eks-fiap-soat-terraform --region sa-east-1

      - name: Deploy Billing Service
        env:
          MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
          MERCADO_PAGO_WEBHOOK_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}
          MERCADO_PAGO_NOTIFICATION_URL: ${{ secrets.MERCADO_PAGO_NOTIFICATION_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          test -n "$MERCADO_PAGO_ACCESS_TOKEN" || {
            echo "::error::MERCADO_PAGO_ACCESS_TOKEN is not configured."
            exit 1
          }
          test -n "$MERCADO_PAGO_WEBHOOK_SECRET" || {
            echo "::error::MERCADO_PAGO_WEBHOOK_SECRET is not configured."
            exit 1
          }
          chmod +x k8s/overlays/aws/deploy.sh
          ./k8s/overlays/aws/deploy.sh

      - name: Update deployment image
        run: |
          kubectl set image deployment/billing-service \
            billing-service=${DOCKERHUB_IMAGE}:sha256-${{ github.sha }} \
            -n techchallenge
          kubectl rollout status deployment/billing-service \
            -n techchallenge \
            --timeout=300s
