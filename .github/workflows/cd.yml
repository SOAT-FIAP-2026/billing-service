name: CD

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "k8s/**"
      - "Dockerfile"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/billing-service

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Billing Service
        uses: actions/checkout@v4

      - name: Checkout shared contracts
        uses: actions/checkout@v4
        with:
          repository: SOAT-FIAP-2026/shared
          ref: main
          path: .shared
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Move shared to sibling directory
        run: |
          rm -rf ../shared
          mv .shared ../shared

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/Billing.Service.Tests/Billing.Service.Tests.csproj

      - name: Build
        run: dotnet build tests/Billing.Service.Tests/Billing.Service.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Billing.Service.Tests/Billing.Service.Tests.csproj --configuration Release --no-build --verbosity normal

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Billing Service
        uses: actions/checkout@v4

      - name: Checkout shared contracts
        uses: actions/checkout@v4
        with:
          repository: SOAT-FIAP-2026/shared
          ref: main
          path: .shared
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Move shared to sibling directory
        run: |
          rm -rf ../shared
          mv .shared ../shared

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha256-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            shared=../shared
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: Checkout Billing Service
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: sa-east-1

      - name: Configure EKS kubeconfig
        run: aws eks update-kubeconfig --name eks-fiap-soat-terraform --region sa-east-1

      - name: Deploy Billing Service
        env:
          MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
          MERCADO_PAGO_WEBHOOK_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}
          MERCADO_PAGO_NOTIFICATION_URL: ${{ secrets.MERCADO_PAGO_NOTIFICATION_URL }}
        run: |
          test -n "$MERCADO_PAGO_ACCESS_TOKEN" || {
            echo "::error::MERCADO_PAGO_ACCESS_TOKEN is not configured."
            exit 1
          }
          test -n "$MERCADO_PAGO_WEBHOOK_SECRET" || {
            echo "::error::MERCADO_PAGO_WEBHOOK_SECRET is not configured."
            exit 1
          }
          chmod +x k8s/overlays/aws/deploy.sh
          ./k8s/overlays/aws/deploy.sh

      - name: Update deployment image
        run: |
          kubectl set image deployment/billing-service \
            billing-service=${DOCKERHUB_IMAGE}:sha256-${{ github.sha }} \
            -n techchallenge
          kubectl rollout status deployment/billing-service \
            -n techchallenge \
            --timeout=300s
