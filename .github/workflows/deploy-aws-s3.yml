name: Deploy Billing Service to Lambda

on:
  push:
    branches:
      - main
    paths:
      - 'src/Billing.Service.Api/**'
      - 'src/Billing.Service.Domain/**'
      - 'src/Billing.Service.Application/**'
      - 'src/Billing.Service.Infrastructure/**'
      - 'src/Billing.Service.External/**'
  workflow_dispatch: 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Billing Service
        uses: actions/checkout@v4
        with:
          path: billing-service
      
      - name: Checkout Shared Contracts
        uses: actions/checkout@v4
        with:
          repository: SOAT-FIAP-2026/shared
          path: shared

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish API
        run: |
          dotnet publish billing-service/src/Billing.Service.Api/Billing.Service.Api.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -o ./publish

      - name: Zip Deployment Package
        run: |
          cd publish
          zip -r ../deployment.zip .
          cd ..

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload Artifact to S3
        run: |
          aws s3 cp deployment.zip s3://fiap-billing-service-api/deployment.zip

      - name: Update Lambda Code
        run: |
          aws lambda update-function-code \
            --function-name fiap-billing-service-api \
            --s3-bucket fiap-billing-service-api \
            --s3-key fiap-billing-service-api/deployment.zip

      - name: Update Lambda environment
        env:
          MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
          MERCADO_PAGO_WEBHOOK_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}
          MERCADO_PAGO_NOTIFICATION_URL: https://figg7rtf4l7sqb2t2fsodkq45m0vmtkt.lambda-url.us-east-2.on.aws/api/v1/pagamento/webhook
        run: |
          set -euo pipefail

          test -n "$MERCADO_PAGO_ACCESS_TOKEN" || {
            echo "::error::Secret MERCADO_PAGO_ACCESS_TOKEN não configurado."
            exit 1
          }
          test -n "$MERCADO_PAGO_WEBHOOK_SECRET" || {
            echo "::error::Secret MERCADO_PAGO_WEBHOOK_SECRET não configurado."
            exit 1
          }

          aws lambda get-function-configuration \
            --function-name fiap-billing-service-api \
            --query 'Environment.Variables' \
            --output json > lambda-environment.json

          jq \
            --arg accessToken "$MERCADO_PAGO_ACCESS_TOKEN" \
            --arg webhookSecret "$MERCADO_PAGO_WEBHOOK_SECRET" \
            --arg notificationUrl "$MERCADO_PAGO_NOTIFICATION_URL" \
            '. + {
              "MercadoPago__AccessToken": $accessToken,
              "MercadoPago__WebhookSecret": $webhookSecret,
              "MercadoPago__NotificationUrl": $notificationUrl
            } | { "Variables": . }' lambda-environment.json > lambda-environment.updated.json

          aws lambda update-function-configuration \
            --function-name fiap-billing-service-api \
            --environment file://lambda-environment.updated.json

          rm -f lambda-environment.json lambda-environment.updated.json
