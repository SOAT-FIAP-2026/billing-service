name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  API_PROJECT: src/Billing.Service.Api/Billing.Service.Api.csproj
  TEST_PROJECT: tests/Billing.Service.Tests/Billing.Service.Tests.csproj

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout shared contracts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: SOAT-FIAP-2026/shared
          ref: main
          path: .shared
          persist-credentials: false

      - name: Move shared to sibling directory (../shared)
        run: |
          rm -rf ../shared
          mv .shared ../shared

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: |
          dotnet restore ${{ env.API_PROJECT }}
          dotnet restore ${{ env.TEST_PROJECT }}

      - name: Build
        run: |
          dotnet build ${{ env.API_PROJECT }} --configuration Release --no-restore
          dotnet build ${{ env.TEST_PROJECT }} --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test ${{ env.TEST_PROJECT }}
          --configuration Release
          --no-build
          --verbosity normal
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Validate Docker Build (with shared context)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          build-contexts: |
            shared=../shared
          push: false
          tags: billing-service:ci
